name: TMD Daily Excel

on:
  workflow_dispatch:
  schedule:
    # 02:17 UTC = 09:17 Asia/Bangkok. GitHub may start later during busy periods.
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: tmd-daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python -m pip install -r requirements.txt
      - name: Read today's 77 provincial forecasts
        env:
          OMP_THREAD_LIMIT: '1'
        run: python collect.py
      - name: Save accumulated data and Excel
        run: |
          git config user.name 'TMD daily data'
          git config user.email 'tmd-daily@users.noreply.github.com'
          git add data/history.csv data/ventilation.xlsx data/last_run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily ventilation data'
            git push
          fi
